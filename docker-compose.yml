name: rikkei-ss05-quickbite

services:
  quickbite-user:
    image: quickbite-user-service:latest
    pull_policy: never
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: "8081"
      SPRING_DATASOURCE_URL: "jdbc:postgresql://${DB_HOST:?DB_HOST is required}:${DB_PORT:?DB_PORT is required}/${USER_DB_NAME:?USER_DB_NAME is required}"
      SPRING_DATASOURCE_USERNAME: "${USER_DB_USER:?USER_DB_USER is required}"
      SPRING_DATASOURCE_PASSWORD: "${USER_DB_PASSWORD:?USER_DB_PASSWORD is required}"
    networks:
      - quickbite-net

  quickbite-restaurant:
    image: quickbite-restaurant-service:latest
    pull_policy: never
    ports:
      - "8082:8082"
    environment:
      SERVER_PORT: "8082"
      SPRING_DATASOURCE_URL: "jdbc:postgresql://${DB_HOST:?DB_HOST is required}:${DB_PORT:?DB_PORT is required}/${RESTAURANT_DB_NAME:?RESTAURANT_DB_NAME is required}"
      SPRING_DATASOURCE_USERNAME: "${RESTAURANT_DB_USER:?RESTAURANT_DB_USER is required}"
      SPRING_DATASOURCE_PASSWORD: "${RESTAURANT_DB_PASSWORD:?RESTAURANT_DB_PASSWORD is required}"
    networks:
      - quickbite-net

  quickbite-order:
    image: quickbite-order-service:latest
    pull_policy: never
    ports:
      - "8083:8083"
    environment:
      SERVER_PORT: "8083"
      SPRING_DATASOURCE_URL: "jdbc:postgresql://${DB_HOST:?DB_HOST is required}:${DB_PORT:?DB_PORT is required}/${ORDER_DB_NAME:?ORDER_DB_NAME is required}"
      SPRING_DATASOURCE_USERNAME: "${ORDER_DB_USER:?ORDER_DB_USER is required}"
      SPRING_DATASOURCE_PASSWORD: "${ORDER_DB_PASSWORD:?ORDER_DB_PASSWORD is required}"
      FEIGN_CLIENT_CONFIG_USER_SERVICE_URL: "http://quickbite-user:8081"
      FEIGN_CLIENT_CONFIG_RESTAURANT_SERVICE_URL: "http://quickbite-restaurant:8082"
      FEIGN_CLIENT_CONFIG_NOTIFICATION_SERVICE_URL: "http://quickbite-notification:8084"
    networks:
      - quickbite-net

  quickbite-notification:
    image: quickbite-notification-service:latest
    pull_policy: never
    ports:
      - "8084:8084"
    environment:
      SERVER_PORT: "8084"
      SPRING_DATASOURCE_URL: "jdbc:postgresql://${DB_HOST:?DB_HOST is required}:${DB_PORT:?DB_PORT is required}/${NOTIFICATION_DB_NAME:?NOTIFICATION_DB_NAME is required}"
      SPRING_DATASOURCE_USERNAME: "${NOTIFICATION_DB_USER:?NOTIFICATION_DB_USER is required}"
      SPRING_DATASOURCE_PASSWORD: "${NOTIFICATION_DB_PASSWORD:?NOTIFICATION_DB_PASSWORD is required}"
    networks:
      - quickbite-net

networks:
  quickbite-net:
    external: true
    name: quickbite-net
